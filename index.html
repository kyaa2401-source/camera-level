<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>精密勾配計測ツール</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* 撮影した画像 (一番下) */
        #displayImg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: contain; z-index: 10; pointer-events: none; }
        
        /* グリッド (その上) */
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: linear-gradient(rgba(0, 255, 0, 0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 0, 0.4) 1px, transparent 1px); background-size: 80px 80px; z-index: 20; pointer-events: none; }
        
        /* 描画キャンバス：一番手前にして、タッチを確実に受け取る (pointer-eventsを有効化) */
        #drawCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 30; pointer-events: auto; touch-action: none; }
        
        #status { position: fixed; bottom: 20px; left: 20px; z-index: 40; background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 5px; font-weight: bold; font-size: 14px; border: 1px solid #0f0; }
        
        /* 支点微調整用の上下左右ボタンパネル */
        .adjust-panel { position: fixed; bottom: 20px; right: 20px; z-index: 40; display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px; gap: 5px; }
        .adj-btn { background: rgba(255,255,255,0.85); color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .adj-btn:active { background: #00ffcc; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .back-btn { position: fixed; top: 20px; right: 20px; z-index: 40; background: #ff4444; color: #fff; border: none; padding: 10px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <img id="displayImg" alt="撮影画像">
    <div class="grid-overlay"></div>
    <canvas id="drawCanvas"></canvas>
    
    <div id="status">① 画面をタッチして支点を置く<br>② ボタンで位置調整 / 指でスライドして線を引く</div>
    
    <!-- 支点微調整ボタン -->
    <div class="adjust-panel">
        <button class="adj-btn btn-up" id="btnUp">⬆️</button>
        <button class="adj-btn btn-left" id="btnLeft">⬅️</button>
        <button class="adj-btn btn-down" id="btnDown">⬇️</button>
        <button class="adj-btn btn-right" id="btnRight">➡️</button>
    </div>

    <button class="back-btn" onclick="window.history.back()">↩ 撮影に戻る</button>

    <script>
        const img = document.getElementById('displayImg');
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        // キャンバスのピクセル解像度を画面サイズに正確に合わせる
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            redraw();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 撮影画像の読み込み
        const savedImage = localStorage.getItem('capturedImageData');
        if (savedImage) {
            img.src = savedImage;
        }

        let pivot = null;
        let currentEnd = null;

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!pivot) return;

            // 支点の描画（大きめの赤丸＋白枠で目立たせる）
            ctx.beginPath();
            ctx.arc(pivot.x, pivot.y, 12, 0, 2 * Math.PI);
            ctx.fillStyle = '#ff0055';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 終点がある場合は線を引く
            if (currentEnd) {
                ctx.beginPath();
                ctx.moveTo(pivot.x, pivot.y);
                ctx.lineTo(currentEnd.x, currentEnd.y);
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 4;
                ctx.stroke();

                let dx = (currentEnd.x - pivot.x) / 80;
                let dy = (pivot.y - currentEnd.y) / 80;
                
                if (Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) {
                    let ratio = Math.abs(dy / dx);
                    let angle = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
                    status.innerHTML = `
                        📏 勾配比 1 : ${ratio.toFixed(2)}<br>
                        📐 角度: ${angle.toFixed(1)}° (横${dx.toFixed(1)}/縦${dy.toFixed(1)})
                    `;
                }
            } else {
                status.innerHTML = `📍 支点設置完了 (ボタンで微調整可)<br>👉 画面を指でスライドして線を引いてください`;
            }
        }

        // 画面タッチ：支点がなければ置く、すでにあればタッチで消去（リセット）
        canvas.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.adjust-panel') || e.target.closest('.back-btn')) return;

            if (!pivot) {
                pivot = { x: e.clientX, y: e.clientY };
                currentEnd = null;
            } else {
                pivot = null;
                currentEnd = null;
                status.innerHTML = `🗑️ 消去しました。<br>画面をタッチして支点を再配置してください`;
            }
            redraw();
        });

        // 指でスライドして線を伸ばす
        canvas.addEventListener('pointermove', (e) => {
            if (!pivot) return;
            currentEnd = { x: e.clientX, y: e.clientY };
            redraw();
        });

        // 上下左右ボタンで支点をピクセル単位で動かす
        const moveStep = 3; 
        document.getElementById('btnUp').addEventListener('click', () => { if(pivot) { pivot.y -= moveStep; redraw(); } });
        document.getElementById('btnDown').addEventListener('click', () => { if(pivot) { pivot.y += moveStep; redraw(); } });
        document.getElementById('btnLeft').addEventListener('click', () => { if(pivot) { pivot.x -= moveStep; redraw(); } });
        document.getElementById('btnRight').addEventListener('click', () => { if(pivot) { pivot.x += moveStep; redraw(); } });
    </script>
</body>
</html>
